[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "ssenvs"
version = "1.1.4"
description = "An optimized OpenAi gym's environment to simulate the Job-Shop Scheduling problem."
readme = "README.md"
authors = [
    {name = "Pierre Tassel", email = "pierre.tassel@aau.at"}
]
license = {text = "MIT License"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "gymnasium>=1.1.1",
    "imageio>=2.37.2",
    "ipykernel>=6.29.5",
    "kaleido>=1.2.0",
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pandas-stubs>=2.3.3.251201",
    "pgmpy",
    "plotly>=6.5.0",
    "pytest>=9.0.2",
    "rustworkx>=0.17.1",
    "sympy>=1.14.0",
]
# Dependencies are handled in setup.py to allow for Python version-specific requirements

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff",
    "codecov>=2.1.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
]

[tool.setuptools.dynamic]
version = {attr = "JSSEnv.__version__"}

[tool.setuptools.packages.find]
include = ["JSSEnv*"]

[tool.uv]
package = true

[tool.uv.sources]
pgmpy = { git = "https://github.com/pgmpy/pgmpy.git", branch = "dev" }

[pytest]
log_cli= true
